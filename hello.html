<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hello Neighbor | Cinematic Menu</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Arial Black', sans-serif; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }

        /* Horror Vignette Overlay */
        .vignette {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.8) 100%);
            z-index: 5; pointer-events: none;
        }

        #ui-layer {
            position: relative; z-index: 10; height: 100vh;
            display: flex; flex-direction: column; justify-content: center;
            padding-left: 8%; background: linear-gradient(to right, rgba(0,0,0,0.7), transparent);
            pointer-events: none;
        }

        .title {
            color: #ffcc00; font-size: clamp(3rem, 8vw, 5rem);
            line-height: 0.85; text-shadow: 4px 4px #cc0000;
            transform: rotate(-5deg); margin-bottom: 40px;
        }

        .btn-container { display: flex; flex-direction: column; gap: 12px; pointer-events: auto; }

        .btn {
            background: #cc0000; color: white; border: none;
            padding: 12px 45px; font-size: 1.4rem; text-align: left;
            width: 280px; clip-path: polygon(8% 0%, 100% 0%, 92% 100%, 0% 100%);
            cursor: pointer; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn:hover { background: #ffcc00; color: black; transform: translateX(15px) scale(1.05); }

        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black; color: white; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100; transition: opacity 1s;
        }
    </style>
</head>
<body>

    <div id="loading">
        <h2 style="color: #ffcc00;">ENTERING THE NEIGHBORHOOD...</h2>
        <div id="status">Status: Fetching 3D Assets</div>
    </div>

    <div class="vignette"></div>

    <div id="ui-layer">
        <h1 class="title">HELLO<br>NEIGHBOR</h1>
        <div class="btn-container">
            <button class="btn">ACT 1: START</button>
            <button class="btn">SETTINGS</button>
            <button class="btn">EXIT GAME</button>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let scene, camera, renderer, mixer, clock;
        
        // This is the position EVERYONE will zoom into
        // (X, Y, Z) -> Change Z to 2.5 for a closer zoom
        const targetZoom = new THREE.Vector3(0, 1.2, 3.8); 

        const MODEL_URL = 'https://raw.githubusercontent.com/jjo268713-cpu/hello/main/hello%20neighbor%20render%20animation%20ee%201.glb';

        function init() {
            scene = new THREE.Scene();
            clock = new THREE.Clock();

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            // Start very far away so the zoom is visible to everyone
            camera.position.set(0, 10, 20); 

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 1.2));
            const light = new THREE.DirectionalLight(0xffffff, 1.5);
            light.position.set(5, 10, 7);
            scene.add(light);

            const loader = new GLTFLoader();
            loader.load(MODEL_URL, (gltf) => {
                scene.add(gltf.scene);

                if (gltf.animations.length) {
                    mixer = new THREE.AnimationMixer(gltf.scene);
                    gltf.animations.forEach(clip => mixer.clipAction(clip).play());
                }

                // Hide loading screen for all players
                const loaderDiv = document.getElementById('loading');
                loaderDiv.style.opacity = '0';
                setTimeout(() => loaderDiv.style.display = 'none', 1000);
            }, 
            (xhr) => {
                const percent = Math.round((xhr.loaded / xhr.total) * 100);
                document.getElementById('status').innerText = `Downloading: ${percent}%`;
            });

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);

            // GLOBAL ZOOM LOGIC
            // Everyone's camera will move toward targetZoom by 2% every frame
            camera.position.lerp(targetZoom, 0.02);
            camera.lookAt(0, 1, 0);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init();
    </script>
</body>
</html>
