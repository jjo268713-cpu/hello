<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hello Neighbor Menu</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Arial Black', sans-serif; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }

        /* UI Overlay mirroring your screenshot */
        #ui-layer {
            position: relative;
            z-index: 10;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 10%;
            background: linear-gradient(to right, rgba(0,0,0,0.8), transparent);
            pointer-events: none;
        }

        .title {
            color: #ffcc00;
            font-size: 5rem;
            line-height: 0.85;
            text-shadow: 4px 4px #cc0000;
            transform: rotate(-5deg);
            margin-bottom: 40px;
        }

        .btn-container { display: flex; flex-direction: column; gap: 10px; pointer-events: auto; }

        .btn {
            background: #cc0000;
            color: white;
            border: none;
            padding: 12px 40px;
            font-size: 1.5rem;
            text-align: left;
            width: 250px;
            clip-path: polygon(10% 0%, 100% 0%, 90% 100%, 0% 100%);
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover { background: #ffcc00; color: black; transform: translateX(10px); }

        #status {
            position: fixed; bottom: 10px; left: 10px; color: white; font-size: 12px; z-index: 20;
        }
    </style>
</head>
<body>

    <div id="status">Status: Initializing...</div>

    <div id="ui-layer">
        <h1 class="title">HELLO<br>NEIGHBOR</h1>
        <div class="btn-container">
            <button class="btn">ACT 1: START</button>
            <button class="btn">SETTINGS</button>
            <button class="btn">EXIT GAME</button>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let scene, camera, renderer, mixer, clock;

        // Use the raw.githubusercontent URL to bypass HTML viewing
        const MODEL_URL = 'https://raw.githubusercontent.com/jjo268713-cpu/hello/main/hello%20neighbor%20render%20animation%20ee%201.glb';

        function init() {
            scene = new THREE.Scene();
            clock = new THREE.Clock();

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 8);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Bright lighting so the model isn't black
            scene.add(new THREE.AmbientLight(0xffffff, 1.5));
            const sun = new THREE.DirectionalLight(0xffffff, 2);
            sun.position.set(5, 10, 5);
            scene.add(sun);

            const loader = new GLTFLoader();
            updateStatus("Loading 3D Animation...");

            loader.load(MODEL_URL, (gltf) => {
                const model = gltf.scene;
                scene.add(model);

                // Auto-center camera on your specific model
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                camera.lookAt(center);

                // Play animation
                if (gltf.animations.length) {
                    mixer = new THREE.AnimationMixer(model);
                    mixer.clipAction(gltf.animations[0]).play();
                }

                updateStatus("System Ready.");
            }, 
            undefined, 
            (err) => {
                updateStatus("Error: Could not load .glb file.");
                console.error(err);
            });

            animate();
        }

        function updateStatus(msg) { document.getElementById('status').innerText = "Status: " + msg; }

        function animate() {
            requestAnimationFrame(animate);
            if (mixer) mixer.update(clock.getDelta());
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init();
    </script>
</body>
</html>
